name: release

# Push a tag such as v0.1.0. The version comes from the tag, the library artifacts go to the
# Central Portal as a deployment that waits for a manual publish, and the command line jar is
# attached to the GitHub release, whose notes are how to get it and the tag's section of
# CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No submodules: the tests read models/ and do not need the benchmark documents in bench/data.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Take the release notes from the changelog
        # the section headed with the tag's version, up to the next one; none stops the release here
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '$0 == heading {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")" || { echo "CHANGELOG.md has no section ## ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Put how to get it above the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf '## Get it\n\nMaven Central, Java 21 or later. The engine has no dependencies at run time; the default models come in a second artifact:\n\n'
            printf '```xml\n<dependency>\n    <groupId>io.github.kamilkrzywanski</groupId>\n    <artifactId>tessernot</artifactId>\n    <version>%s</version>\n</dependency>\n<dependency>\n    <groupId>io.github.kamilkrzywanski</groupId>\n    <artifactId>tessernot-models</artifactId>\n    <version>%s</version>\n</dependency>\n```\n\n' "$version" "$version"
            printf '```kotlin\nimplementation("io.github.kamilkrzywanski:tessernot:%s")\nimplementation("io.github.kamilkrzywanski:tessernot-models:%s")\n```\n\n' "$version" "$version"
            printf 'PDF input is `tessernot-pdf`, the Polish word lists `tessernot-models-pl`.\n\n'
            printf 'The command line is `tessernot-cli.jar` below, with the models inside: `java --add-modules jdk.incubator.vector -jar tessernot-cli.jar ocr scan.jpg`\n\n'
            cat "$RUNNER_TEMP/release-notes.md"
          } > "$RUNNER_TEMP/release-body.md"
      - name: Install DejaVu, the font of the rendered test pages
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Take the version from the tag
        run: ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Verify and publish
        # The runner's own processor count: the default of the POM sets twelve.
        run: ./mvnw -B -P release deploy -Dtest.jvm.cpus=
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish the GitHub release with the command line jar
        uses: softprops/action-gh-release@v2
        with:
          name: Tessernot ${{ github.ref_name }}
          files: tessernot-cli/target/tessernot-cli.jar
          body_path: ${{ runner.temp }}/release-body.md
