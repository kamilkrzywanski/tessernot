name: release

# Two kinds of tag, each a deployment to the Central Portal that waits for a manual publish:
#
# - v0.1.2: the engine, PDF input and the command line. The version comes from the tag. The models
#   are not deployed: the release depends on tessernot-models of tessernot.models.version in the
#   parent POM, which is already on Maven Central. The command line jar is attached to the GitHub
#   release, whose notes are how to get it and the tag's section of CHANGELOG.md.
# - models-v0.2.0: tessernot-models and tessernot-models-pl only, when the files in models/
#   change. The tag must match their <version> and tessernot.models.version; their POMs are
#   flattened to name no parent and no dependencies. Release the models first, then the engine
#   that uses them.
on:
  push:
    tags:
      - "v*"
      - "models-v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No submodules: the tests read models/ and do not need the benchmark documents in bench/data.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Take the release notes from the changelog
        # the section headed with the tag's version, up to the next one; none stops the release here
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '$0 == heading {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")" || { echo "CHANGELOG.md has no section ## ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Put how to get it above the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          models=$(sed -n 's:.*<tessernot.models.version>\(.*\)</tessernot.models.version>.*:\1:p' pom.xml)
          {
            printf '## Get it\n\nMaven Central, Java 21 or later. The engine has no dependencies at run time; the default models come in a second artifact, with a version of their own that changes only when the models do:\n\n'
            printf '```xml\n<dependency>\n    <groupId>io.github.kamilkrzywanski</groupId>\n    <artifactId>tessernot</artifactId>\n    <version>%s</version>\n</dependency>\n<dependency>\n    <groupId>io.github.kamilkrzywanski</groupId>\n    <artifactId>tessernot-models</artifactId>\n    <version>%s</version>\n</dependency>\n```\n\n' "$version" "$models"
            printf '```kotlin\nimplementation("io.github.kamilkrzywanski:tessernot:%s")\nimplementation("io.github.kamilkrzywanski:tessernot-models:%s")\n```\n\n' "$version" "$models"
            printf 'PDF input is `tessernot-pdf` %s, the Polish word lists `tessernot-models-pl` %s.\n\n' "$version" "$models"
            printf 'The command line is `tessernot-cli.jar` below, with the models inside: `java --add-modules jdk.incubator.vector -jar tessernot-cli.jar ocr scan.jpg`\n\n'
            printf 'Or run it from Maven Central with [JBang](https://www.jbang.dev/): `jbang --java-options=--add-modules=jdk.incubator.vector io.github.kamilkrzywanski:tessernot-cli:%s ocr scan.jpg`\n\n' "$version"
            cat "$RUNNER_TEMP/release-notes.md"
          } > "$RUNNER_TEMP/release-body.md"
      - name: Install DejaVu, the font of the rendered test pages
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Take the version from the tag
        # The model modules keep their own <version>; only their parent reference follows.
        run: ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Verify and publish, without the models
        # The runner's own processor count: the default of the POM sets twelve.
        run: ./mvnw -B -P release deploy -pl '!tessernot-models,!tessernot-models-pl' -Dtest.jvm.cpus=
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish the GitHub release with the command line jar
        uses: softprops/action-gh-release@v2
        with:
          name: Tessernot ${{ github.ref_name }}
          files: tessernot-cli/target/tessernot-cli.jar
          body_path: ${{ runner.temp }}/release-body.md

  models:
    if: startsWith(github.ref_name, 'models-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Check that the tag names the version in the POMs
        run: |
          version="${GITHUB_REF_NAME#models-v}"
          for pom in tessernot-models/pom.xml tessernot-models-pl/pom.xml; do
            own=$(sed -n '/<\/parent>/,$ s:^    <version>\(.*\)</version>:\1:p' "$pom" | head -1)
            test "$own" = "$version" || { echo "$pom has version $own, the tag says $version"; exit 1; }
          done
          managed=$(sed -n 's:.*<tessernot.models.version>\(.*\)</tessernot.models.version>.*:\1:p' pom.xml)
          test "$managed" = "$version" || { echo "tessernot.models.version is $managed, the tag says $version"; exit 1; }
      - name: Install DejaVu, the font of the rendered test pages
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Build the engine the models compile and test against
        run: ./mvnw -B -pl tessernot -am install -DskipTests
      - name: Verify and publish the models
        run: ./mvnw -B -P release deploy -pl tessernot-models,tessernot-models-pl -Dtest.jvm.cpus=
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
