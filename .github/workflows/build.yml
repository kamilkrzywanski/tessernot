name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the tests read models/ and do not need the benchmark documents in bench/data.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install DejaVu, the font of the rendered test pages
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Build and test
        run: mvn -B verify
      - name: Fail when a test was skipped
        # A test that needs models/ skips itself when they are missing; on CI that is an error.
        run: |
          if grep -l 'skipped="[1-9]' */target/surefire-reports/TEST-*.xml; then
            echo "tests were skipped"
            exit 1
          fi
